<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">OBS Studio plugin for Control Deck</title>
  <desc id="desc">A dark Control Deck interface showing OBS recording, scene and audio controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1019"/><stop offset="1" stop-color="#17132a"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8067ff"/><stop offset="1" stop-color="#5138d8"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1050" cy="100" r="210" fill="#6b5cff" opacity=".16" filter="url(#glow)"/>
  <rect x="72" y="60" width="1136" height="600" rx="34" fill="#090b11" stroke="#ffffff" stroke-opacity=".12"/>
  <rect x="72" y="60" width="1136" height="76" rx="34" fill="#11151f"/>
  <circle cx="116" cy="98" r="8" fill="#ff6b73"/><circle cx="143" cy="98" r="8" fill="#f9c65a"/><circle cx="170" cy="98" r="8" fill="#5fd29b"/>
  <text x="214" y="108" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">OBS Studio</text>
  <rect x="1025" y="83" width="145" height="32" rx="16" fill="#173a2c" stroke="#57d69a" stroke-opacity=".35"/><circle cx="1048" cy="99" r="5" fill="#57d69a"/><text x="1062" y="105" fill="#9aefc6" font-family="Inter,Arial,sans-serif" font-size="14">Connected</text>
  <text x="116" y="185" fill="#ffffff" fill-opacity=".42" font-family="Inter,Arial,sans-serif" font-size="15" letter-spacing="2">OFFICIAL CONTROL DECK PLUGIN</text>
  <text x="116" y="231" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">Live production controls</text>
  <g transform="translate(116 274)">
    <rect width="224" height="132" rx="22" fill="url(#violet)"/><circle cx="50" cy="49" r="18" fill="none" stroke="#fff" stroke-width="5"/><text x="30" y="102" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Record</text>
    <rect x="242" width="224" height="132" rx="22" fill="#151a26" stroke="#fff" stroke-opacity=".12"/><path d="M283 40l24 14-24 14z" fill="#77ddff"/><text x="272" y="102" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Stream</text>
    <rect x="484" width="224" height="132" rx="22" fill="#151a26" stroke="#fff" stroke-opacity=".12"/><rect x="516" y="38" width="34" height="25" rx="4" fill="none" stroke="#b9abff" stroke-width="4"/><text x="514" y="102" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Scenes</text>
    <rect x="726" width="224" height="132" rx="22" fill="#151a26" stroke="#fff" stroke-opacity=".12"/><path d="M760 62h10l13-13v36l-13-13h-10z" fill="#76e1c2"/><text x="756" y="102" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Audio mixer</text>
  </g>
  <g transform="translate(116 430)">
    <rect width="950" height="160" rx="22" fill="#10141e" stroke="#fff" stroke-opacity=".1"/>
    <text x="28" y="38" fill="#ffffff" fill-opacity=".4" font-family="Inter,Arial,sans-serif" font-size="13" letter-spacing="1.5">LIVE STATUS</text>
    <text x="28" y="78" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">Desktop Audio</text>
    <rect x="28" y="103" width="724" height="12" rx="6" fill="#252b38"/><rect x="28" y="103" width="536" height="12" rx="6" fill="url(#violet)"/>
    <rect x="784" y="85" width="136" height="48" rx="14" fill="#202637"/><text x="816" y="115" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">Unmuted</text>
  </g>
  <g transform="translate(1090 540)"><circle r="54" fill="#161b27" stroke="#fff" stroke-opacity=".15"/><circle r="31" fill="none" stroke="#fff" stroke-width="7"/><path d="M1060 518c20 12 40 12 60 0M1060 562c20-12 40-12 60 0" transform="translate(-1090 -540)" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g>
</svg>
